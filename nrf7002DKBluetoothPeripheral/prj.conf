CONFIG_NCS_SAMPLES_DEFAULTS=y

# Enable Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Enable the My Service
CONFIG_BT_MY_SERVICE=y
CONFIG_BT_MY_SERVICE_POLL_BUTTON=y

# Enable settings subsystem
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# Enable security
CONFIG_BT_MY_SERVICE_SECURITY_ENABLED=y

# Enable DK library
CONFIG_DK_LIBRARY=y

# System configuration
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging configuration
CONFIG_LOG=y
# CONFIG_LOG_DEFAULT_LEVEL=4